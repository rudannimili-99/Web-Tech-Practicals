<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Marks Manager | Experiment 8</title>
<style>
  /* ===== Practical 8 - Dark Purple Theme ===== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #10051f;
    color: #f3e8ff;
}

/* Header */
header {
    background: linear-gradient(135deg, #1e0b3d, #4c1d95);
    color: white;
    padding: 28px 40px;
    border-bottom: 2px solid #7c3aed;
}

header h1 {
    margin: 0 0 4px;
    font-size: 2rem;
}

header p {
    margin: 0;
    color: #ddd6fe;
    font-size: 1rem;
}

/* Main */
main {
    max-width: 820px;
    margin: 20px auto;
    padding: 0 20px;
}

/* Form */
.panel {
    display: grid;
    grid-template-columns: 1fr 1fr 1.1fr auto;
    gap: 10px;
    margin-bottom: 14px;
}

.panel input,
.panel select {
    width: 100%;
    padding: 10px;
    border: 1px solid #8b5cf6;
    border-radius: 6px;
    background: #f8f5ff;
    color: #1e1033;
    font-size: 14px;
}

button {
    border: none;
    border-radius: 6px;
    padding: 9px 14px;
    background: #6d28d9;
    color: white;
    cursor: pointer;
    font-size: 14px;
    transition: 0.2s;
}

button:hover {
    background: #8b5cf6;
    transform: translateY(-1px);
}

/* Toolbar */
.toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

.toolbar button {
    background: #4b5563;
}

.toolbar button:hover {
    background: #6d28d9;
}

/* Table */
table {
    width: 100%;
    border-collapse: collapse;
    background: #1e293b;
    border-radius: 8px;
    overflow: hidden;
}

thead {
    background: #ede9fe;
    color: #1e293b;
}

th {
    padding: 10px;
    text-align: left;
    font-weight: 700;
}

td {
    padding: 10px;
    border-bottom: 1px solid #64748b;
    color: #e2e8f0;
}

tbody tr:hover {
    background: #2e1a47;
}

/* Pass / Fail */
td:nth-child(5) {
    font-weight: bold;
}

td:nth-child(5) {
    color: #22c55e;
}

/* Delete button */
td button {
    background: #ef4444;
    padding: 5px 12px;
    font-size: 13px;
}

td button:hover {
    background: #dc2626;
}

/* Statistics */
.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 16px;
}

.stats > div {
    background: #1e293b;
    border-top: 3px solid #7c3aed;
    border-radius: 7px;
    padding: 14px;
    text-align: center;
    color: #f3e8ff;
}

/* If JS creates stat cards using headings */
.stats strong {
    display: block;
    font-size: 1.5rem;
    color: #f3e8ff;
}

.stats span {
    color: #ddd6fe;
}

/* Dark theme */
.dark {
    background: #10051f;
    color: #f3e8ff;
}

/* Responsive */
@media (max-width: 768px) {

    .panel {
        grid-template-columns: 1fr 1fr;
    }

    .panel button {
        grid-column: span 2;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 500px) {

    header {
        padding: 22px 20px;
    }

    header h1 {
        font-size: 1.5rem;
    }

    main {
        padding: 0 12px;
    }

    .panel {
        grid-template-columns: 1fr;
    }

    .panel button {
        grid-column: auto;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    table {
        font-size: 13px;
    }

    th,
    td {
        padding: 8px 6px;
    }
}
</style>
</head>

<body>

  <header>
    <h1>Student Marks Manager</h1>
    <p>Functions &middot; Arrays &middot; Objects &middot; DOM Manipulation</p>
  </header>

  <main>

    <form id="studentForm" class="panel">

      <input
        type="text"
        id="name"
        placeholder="Student name"
        required
      >

      <input
        type="number"
        id="marks"
        placeholder="Marks (0-100)"
        min="0"
        max="100"
        required
      >

      <select id="branch">
        <option value="CE">CE</option>
        <option value="IT">IT</option>
        <option value="AIDS">AI&amp;DS</option>
      </select>

      <button type="submit">Add Student</button>

    </form>

    <div class="toolbar">
      <button id="sortBtn">Sort by Marks</button>
      <button id="filterBtn">Show Passed Only</button>
      <button id="resetBtn">Show All</button>
      <button id="themeBtn">Toggle Theme</button>
    </div>

    <table>

      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Branch</th>
          <th>Marks</th>
          <th>Result</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="tableBody"></tbody>

    </table>

    <section id="stats" class="stats"></section>

  </main>

  <script src="app.js"></script>

</body>

</html>
