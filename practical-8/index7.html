<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Marks Manager | Experiment 8</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f3e8ff;
    color: #2e1065;
  }

  .wrapper {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 20px;
    max-width: 980px;
    margin: 24px auto;
    padding: 0 20px;
  }

  form,
  .events {
    background: #fff;
    border-radius: 10px;
    padding: 22px 26px;
    box-shadow: 0 4px 14px rgba(59, 7, 100, 0.12);
  }

  h1 {
    font-size: 1.35rem;
    color: #3b0764;
    margin-top: 0;
  }

  h2 {
    font-size: 1.1rem;
    color: #581c87;
    margin-top: 0;
  }

  .field {
    margin-bottom: 12px;
  }

  .field label {
    display: block;
    font-weight: 600;
    font-size: 0.9rem;
    margin-bottom: 4px;
  }

  .field input[type="text"],
  .field input[type="email"],
  .field input[type="tel"],
  .field input[type="password"] {
    width: 100%;
    padding: 9px 11px;
    border: 1.5px solid #c4b5fd;
    border-radius: 6px;
    font-size: 0.95rem;
  }

  .field input:focus {
    outline: none;
    border-color: #7e22ce;
    box-shadow: 0 0 0 3px rgba(126, 34, 206, 0.12);
  }

  .field.inline {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .field.inline label {
    display: inline;
    font-weight: 400;
    margin: 0;
  }

  .field.inline .error {
    flex-basis: 100%;
  }

  .field.invalid input {
    border-color: #dc2626;
    background: #fef2f2;
  }

  .field.valid input {
    border-color: #16a34a;
    background: #f0fdf4;
  }

  .error {
    color: #dc2626;
    font-size: 0.8rem;
    min-height: 1em;
    display: block;
  }

  .hint {
    color: #7e22ce;
    font-size: 0.8rem;
  }

  .meter {
    height: 6px;
    background: #e9d5ff;
    border-radius: 3px;
    margin-top: 6px;
    overflow: hidden;
  }

  .meter span {
    display: block;
    height: 100%;
    width: 0;
    transition: width 0.3s, background 0.3s;
  }

  button {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 6px;
    background: #3b0764;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background: #581c87;
  }

  #formMessage {
    margin: 12px 0 0;
    padding: 0;
    font-weight: 600;
  }

  #formMessage.success {
    color: #15803d;
    background: #dcfce7;
    padding: 10px;
    border-radius: 6px;
  }

  #formMessage.fail {
    color: #b91c1c;
    background: #fee2e2;
    padding: 10px;
    border-radius: 6px;
  }

  .hover-box {
    padding: 22px;
    text-align: center;
    border: 2px dashed #a855f7;
    border-radius: 8px;
    transition: background 0.2s;
    user-select: none;
  }

  .hover-box.active {
    background: #e9d5ff;
    border-color: #7e22ce;
  }

  .hover-box.clicked {
    background: #f3e8ff;
  }

  #log {
    list-style: none;
    padding: 0;
    font-family: Consolas, monospace;
    font-size: 0.8rem;
    max-height: 260px;
    overflow: auto;
  }

  #log li {
    padding: 4px 6px;
    border-bottom: 1px solid #e9d5ff;
  }

  @media (max-width: 768px) {
    .wrapper {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>

  <header>
    <h1>Student Marks Manager</h1>
    <p>Functions &middot; Arrays &middot; Objects &middot; DOM Manipulation</p>
  </header>

  <main>

    <form id="studentForm" class="panel">

      <input
        type="text"
        id="name"
        placeholder="Student name"
        required
      >

      <input
        type="number"
        id="marks"
        placeholder="Marks (0-100)"
        min="0"
        max="100"
        required
      >

      <select id="branch">
        <option value="CE">CE</option>
        <option value="IT">IT</option>
        <option value="AIDS">AI&amp;DS</option>
      </select>

      <button type="submit">Add Student</button>

    </form>

    <div class="toolbar">
      <button id="sortBtn">Sort by Marks</button>
      <button id="filterBtn">Show Passed Only</button>
      <button id="resetBtn">Show All</button>
      <button id="themeBtn">Toggle Theme</button>
    </div>

    <table>

      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Branch</th>
          <th>Marks</th>
          <th>Result</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="tableBody"></tbody>

    </table>

    <section id="stats" class="stats"></section>

  </main>

  <script src="app.js"></script>

</body>

</html>
