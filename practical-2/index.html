<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 2</title>

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        iframe {
            display: block;
            width: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <!-- Registration Page -->
    <iframe
        id="registrationFrame"
        src="registration.html"
        title="Workshop Registration">
    </iframe>

    <!-- Media Page -->
    <iframe
        id="mediaFrame"
        src="media.html"
        title="Media and Semantic HTML">
    </iframe>

    <script>
        function resizeFrame(frame) {
            frame.onload = function () {
                frame.style.height =
                    frame.contentWindow.document.documentElement.scrollHeight + "px";
            };
        }

        resizeFrame(document.getElementById("registrationFrame"));
        resizeFrame(document.getElementById("mediaFrame"));
    </script>

</body>
</html>
