<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Basics | Experiment 7</title>

  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px 28px;
      color: #1f2937;
    }

    h1 {
      color: #1b2a4a;
      margin-top: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    section {
      background: #fff;
      border-left: 4px solid #3b82f6;
      border-radius: 6px;
      padding: 12px 16px;
    }

    h2 {
      font-size: 1rem;
      margin: 0 0 8px;
      color: #1b2a4a;
    }

    pre {
      margin: 0;
      font-family: Consolas, monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h1>JavaScript Fundamentals</h1>

  <div class="grid">

    <section>
      <h2>1. Variables &amp; Data Types</h2>
      <pre id="out-vars"></pre>
    </section>

    <section>
      <h2>2. Operators</h2>
      <pre id="out-ops"></pre>
    </section>

    <section>
      <h2>3. Conditions (if / else if / switch)</h2>
      <pre id="out-cond"></pre>
    </section>

    <section>
      <h2>4. Loops</h2>
      <pre id="out-loops"></pre>
    </section>

  </div>

  <script src="script.js"></script>

</body>
</html>
