<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Basics | Experiment 7</title>

  <style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f3e8ff;
    margin: 0;
    padding: 20px 28px;
    color: #2e1065;
  }

  h1 {
    color: #3b0764;
    margin-top: 0;
    text-align: center;
    font-size: 2rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    max-width: 1000px;
    margin: 25px auto;
  }

  section {
    background: #ffffff;
    border-left: 5px solid #6b21a8;
    border-radius: 10px;
    padding: 16px 18px;
    box-shadow: 0 5px 15px rgba(59, 7, 100, 0.15);
    transition: 0.3s;
  }

  section:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(59, 7, 100, 0.25);
  }

  h2 {
    font-size: 1rem;
    margin: 0 0 10px;
    color: #581c87;
  }

  pre {
    margin: 0;
    font-family: Consolas, monospace;
    font-size: 0.85rem;
    white-space: pre-wrap;
    line-height: 1.6;
    color: #3b0764;
  }

  @media (max-width: 700px) {
    .grid {
      grid-template-columns: 1fr;
    }

    body {
      padding: 15px;
    }
  }
</style>
</head>

<body>

  <h1>JavaScript Fundamentals</h1>

  <div class="grid">

    <section>
      <h2>1. Variables &amp; Data Types</h2>
      <pre id="out-vars"></pre>
    </section>

    <section>
      <h2>2. Operators</h2>
      <pre id="out-ops"></pre>
    </section>

    <section>
      <h2>3. Conditions (if / else if / switch)</h2>
      <pre id="out-cond"></pre>
    </section>

    <section>
      <h2>4. Loops</h2>
      <pre id="out-loops"></pre>
    </section>

  </div>

  <script src="script.js"></script>

</body>
</html>
