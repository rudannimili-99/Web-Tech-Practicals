           PROFILE IMAGE

        .profile-image {

            margin: 12px auto 0;

            border-radius: 5px;
        }

        /* =========================
           LINKS SECTION
        ========================== */

        .links-section {

            padding: 25px;
        }

        .links-section a {

            display: block;

            text-decoration: none;

            color: #62419a;

            background: #f0e8fa;

            padding: 11px 15px;

            margin-bottom: 9px;

            border-radius: 8px;

            font-size: 15px;

            font-weight: bold;

            border-left: 4px solid #7652b8;

            transition: 0.3s;
        }

        .links-section a:hover {

            background: #7652b8;

            color: white;

            padding-left: 22px;

            transform: translateX(3px);
        }

           MOBILE RESPONSIVE
        ========================== */

        @media (max-width: 700px) {
