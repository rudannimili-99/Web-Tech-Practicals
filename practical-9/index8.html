<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JavaScript Form Validation | Experiment 9</title>

  <style>
    /* ===== BASIC RESET ===== */
    * {
      box-sizing: border-box;
    }

    /* ===== PAGE ===== */
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f3e8ff;
      color: #2e1065;
    }

    /* ===== MAIN LAYOUT ===== */
    .wrapper {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 20px;
      max-width: 980px;
      margin: 24px auto;
      padding: 0 20px;
    }

    /* ===== FORM AND EVENTS CARDS ===== */
    form,
    .events {
      background: #ffffff;
      border-radius: 12px;
      padding: 22px 26px;
      box-shadow: 0 5px 18px rgba(59, 7, 100, 0.15);
    }

    /* ===== HEADINGS ===== */
    h1 {
      font-size: 1.5rem;
      color: #3b0764;
      margin-top: 0;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 1.1rem;
      color: #581c87;
      margin-top: 0;
    }

    /* ===== FORM FIELDS ===== */
    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 5px;
      color: #3b0764;
    }

    .field input[type="text"],
    .field input[type="email"],
    .field input[type="tel"],
    .field input[type="password"] {
      width: 100%;
      padding: 10px 11px;
      border: 1.5px solid #c4b5fd;
      border-radius: 7px;
      font-size: 0.95rem;
      background: #ffffff;
      color: #2e1065;
    }

    .field input:focus {
      outline: none;
      border-color: #7e22ce;
      box-shadow: 0 0 0 3px rgba(126, 34, 206, 0.15);
    }

    /* ===== INLINE FIELDS ===== */
    .field.inline {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .field.inline label {
      display: inline;
      font-weight: 400;
      margin: 0;
    }

    .field.inline .error {
      flex-basis: 100%;
    }

    /* ===== VALID / INVALID STATES ===== */
    .field.invalid input {
      border-color: #dc2626;
      background: #fef2f2;
    }

    .field.valid input {
      border-color: #16a34a;
      background: #f0fdf4;
    }

    /* ===== ERROR MESSAGE ===== */
    .error {
      color: #dc2626;
      font-size: 0.8rem;
      min-height: 1em;
      display: block;
      margin-top: 3px;
    }

    /* ===== HINT ===== */
    .hint {
      color: #7e22ce;
      font-size: 0.8rem;
    }

    /* ===== PASSWORD STRENGTH METER ===== */
    .meter {
      height: 7px;
      background: #e9d5ff;
      border-radius: 4px;
      margin-top: 6px;
      overflow: hidden;
    }

    .meter span {
      display: block;
      height: 100%;
      width: 0;
      transition: width 0.3s, background 0.3s;
    }

    /* ===== SUBMIT BUTTON ===== */
    button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 7px;
      background: #3b0764;
      color: #ffffff;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #7e22ce;
      transform: translateY(-1px);
    }

    /* ===== FORM MESSAGE ===== */
    #formMessage {
      margin: 12px 0 0;
      padding: 0;
      font-weight: 600;
    }

    #formMessage.success {
      color: #15803d;
      background: #dcfce7;
      padding: 10px;
      border-radius: 7px;
    }

    #formMessage.fail {
      color: #b91c1c;
      background: #fee2e2;
      padding: 10px;
      border-radius: 7px;
    }

    /* ===== EVENT DEMO BOX ===== */
    .hover-box {
      padding: 22px;
      text-align: center;
      border: 2px dashed #a855f7;
      border-radius: 9px;
      background: #faf5ff;
      transition: background 0.2s, border-color 0.2s;
      user-select: none;
      cursor: pointer;
    }

    .hover-box.active {
      background: #e9d5ff;
      border-color: #7e22ce;
    }

    .hover-box.clicked {
      background: #ddd6fe;
      border-color: #581c87;
    }

    /* ===== EVENT LOG ===== */
    #log {
      list-style: none;
      padding: 0;
      font-family: Consolas, monospace;
      font-size: 0.8rem;
      max-height: 260px;
      overflow: auto;
    }

    #log li {
      padding: 5px 7px;
      border-bottom: 1px solid #e9d5ff;
      color: #4c1d95;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .wrapper {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 500px) {
      body {
        background: #f3e8ff;
      }

      .wrapper {
        padding: 0 12px;
      }

      form,
      .events {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <!-- ================= FORM ================= -->
    <form id="registrationForm">

      <h1>Student Registration Form</h1>

      <!-- Name -->
      <div class="field" id="nameField">
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your name"
        >
        <span class="error" id="nameError"></span>
      </div>

      <!-- Email -->
      <div class="field" id="emailField">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
        >
        <span class="error" id="emailError"></span>
      </div>

      <!-- Mobile -->
      <div class="field" id="mobileField">
        <label for="mobile">Mobile Number</label>
        <input
          type="tel"
          id="mobile"
          name="mobile"
          placeholder="Enter 10-digit mobile number"
        >
        <span class="error" id="mobileError"></span>
      </div>

      <!-- Password -->
      <div class="field" id="passwordField">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter password"
        >

        <div class="meter">
          <span id="strengthBar"></span>
        </div>

        <span class="hint" id="strengthText">
          Password strength
        </span>

        <span class="error" id="passwordError"></span>
      </div>

      <!-- Confirm Password -->
      <div class="field" id="confirmField">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="Re-enter password"
        >
        <span class="error" id="confirmError"></span>
      </div>

      <!-- Terms -->
      <div class="field inline" id="termsField">
        <input
          type="checkbox"
          id="terms"
          name="terms"
        >

        <label for="terms">
          I agree to the terms and conditions
        </label>

        <span class="error" id="termsError"></span>
      </div>

      <!-- Submit -->
      <button type="submit">
        Register
      </button>

      <p id="formMessage"></p>

    </form>


    <!-- ================= EVENTS ================= -->
    <section class="events">

      <h2>JavaScript Events</h2>

      <div class="hover-box" id="hoverBox">
        Hover and click this box
      </div>

      <h2 style="margin-top: 22px;">
        Event Log
      </h2>

      <ul id="log"></ul>

    </section>

  </div>


  <!-- JavaScript -->
  <script src="validate.js"></script>

</body>
</html>
