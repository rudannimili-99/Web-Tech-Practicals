<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Handling & Validation | Experiment 9</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #eef2f8;
      color: #1f2937;
    }

    .wrapper {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 20px;
      max-width: 980px;
      margin: 24px auto;
      padding: 0 20px;
    }

    form,
    .events {
      background: #fff;
      border-radius: 10px;
      padding: 22px 26px;
      box-shadow: 0 4px 14px rgba(27, 42, 74, 0.08);
    }

    h1 {
      font-size: 1.35rem;
      color: #1b2a4a;
      margin-top: 0;
    }

    h2 {
      font-size: 1.1rem;
      color: #1b2a4a;
      margin-top: 0;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .field input[type="text"],
    .field input[type="email"],
    .field input[type="tel"],
    .field input[type="password"] {
      width: 100%;
      padding: 9px 11px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .field.inline {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .field.inline label {
      display: inline;
      font-weight: 400;
      margin: 0;
    }

    .field.inline .error {
      flex-basis: 100%;
    }

    /* States toggled from JavaScript */
    .field.invalid input {
      border-color: #dc2626;
      background: #fef2f2;
    }

    .field.valid input {
      border-color: #16a34a;
      background: #f0fdf4;
    }

    .error {
      color: #dc2626;
      font-size: 0.8rem;
      min-height: 1em;
      display: block;
    }

    .hint {
      color: #64748b;
      font-size: 0.8rem;
    }

    .meter {
      height: 6px;
      background: #e5e7eb;
      border-radius: 3px;
      margin-top: 6px;
      overflow: hidden;
    }

    .meter span {
      display: block;
      height: 100%;
      width: 0;
      transition: width 0.3s, background 0.3s;
    }

    button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 6px;
      background: #1b2a4a;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background: #2f5d9f;
    }

    #formMessage {
      margin: 12px 0 0;
      padding: 0;
      font-weight: 600;
    }

    #formMessage.success {
      color: #15803d;
      background: #dcfce7;
      padding: 10px;
      border-radius: 6px;
    }

    #formMessage.fail {
      color: #b91c1c;
      background: #fee2e2;
      padding: 10px;
      border-radius: 6px;
    }

    .hover-box {
      padding: 22px;
      text-align: center;
      border: 2px dashed #94a3b8;
      border-radius: 8px;
      transition: background 0.2s;
      user-select: none;
    }

    .hover-box.active {
      background: #dbeafe;
      border-color: #3b82f6;
    }

    .hover-box.clicked {
      background: #fde68a;
    }

    #log {
      list-style: none;
      padding: 0;
      font-family: Consolas, monospace;
      font-size: 0.8rem;
      max-height: 260px;
      overflow: auto;
    }

    #log li {
      padding: 4px 6px;
      border-bottom: 1px solid #eef2f8;
    }

    @media (max-width: 768px) {
      .wrapper {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="wrapper">

    <!-- Registration form validated with JavaScript -->
    <form id="signupForm" novalidate>

      <h1>Create CodingPro Account</h1>

      <div class="field">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="e.g. Mili Atulbhai Rudani">
        <small class="error"></small>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="name@example.com">
        <small class="error"></small>
      </div>

      <div class="field">
        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" placeholder="10-digit number" maxlength="10">
        <small class="error"></small>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Min 8 chars, 1 uppercase, 1 digit">

        <div class="meter">
          <span id="strengthBar"></span>
        </div>

        <small id="strengthText" class="hint"></small>
        <small class="error"></small>
      </div>

      <div class="field">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm">
        <small class="error"></small>
      </div>

      <div class="field inline">
        <input type="checkbox" id="terms">
        <label for="terms">I accept the terms and conditions</label>
        <small class="error"></small>
      </div>

      <button type="submit" id="submitBtn">Register</button>

      <p id="formMessage" role="status"></p>

    </form>

    <!-- Panel that demonstrates other event types -->
    <aside class="events">

      <h2>Event Log</h2>

      <div id="hoverBox" class="hover-box">
        Hover / double-click me
      </div>

      <p>
        Characters typed in name:
        <strong id="charCount">0</strong>
      </p>

      <p>
        Last key pressed:
        <strong id="lastKey">&ndash;</strong>
      </p>

      <ul id="log"></ul>

    </aside>

  </main>

  <script src="validate.js"></script>

</body>

</html>
